<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa Real &mdash; Cartas de Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-dark: #0b3d2e;
    --felt: #124a37;
    --felt-light: #1c604a;
    --gold: #c9a24b;
    --gold-bright: #e6c876;
    --cream: #f6f1e4;
    --ink: #1b1b1b;
    --red: #a3273f;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, var(--felt-light), var(--felt) 55%, var(--felt-dark) 100%);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--cream);
    padding: 56px 20px 80px;
  }

  .table-head{
    text-align: center;
    margin-bottom: 44px;
  }

  .eyebrow{
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    letter-spacing: 1px;
    margin: 0 0 12px;
    color: var(--cream);
  }

  .table-head p{
    max-width: 46ch;
    margin: 0 auto;
    color: rgba(246,241,228,0.75);
    font-size: 17px;
    font-style: italic;
  }

  #playing-cards{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .card{
    display: flex;
    justify-content: space-between;
    width: 170px;
    height: 240px;
    background: linear-gradient(160deg, var(--cream) 0%, #ece4cd 100%);
    border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.15);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.5) inset,
      0 18px 30px -14px rgba(0,0,0,0.55);
    padding: 14px;
    position: relative;
    color: var(--ink);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card::before{
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 9px;
    pointer-events: none;
  }

  .card:hover{
    transform: translateY(-6px) rotate(-1deg);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.5) inset,
      0 26px 34px -14px rgba(0,0,0,0.6);
  }

  .card.red .rank{ color: var(--red); }
  .card.red .suit-big{ color: var(--red); }
  .card.black .rank{ color: var(--ink); }
  .card.black .suit-big{ color: var(--ink); }

  .left, .right{
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
    z-index: 1;
  }

  .left{
    align-self: flex-start;
  }

  .right{
    align-self: flex-end;
    transform: rotate(180deg);
  }

  .rank{
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
  }

  .corner-suit{
    font-size: 16px;
    margin-top: 2px;
  }

  .middle{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    align-self: center;
    flex: 1;
    gap: 4px;
  }

  .suit-big{
    font-size: 58px;
    line-height: 1;
  }

  .card-name{
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(27,27,27,0.55);
  }

  .table-foot{
    text-align: center;
    margin-top: 48px;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(230,200,118,0.6);
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
</style>
</head>
<body>

  <div class="table-head">
    <p class="eyebrow">Mesa Real &middot; Naipes &amp; Fortuna</p>
    <h1>Cartas de Jogo</h1>
    <p>Uma pequena vitrine das cartas mais nobres do baralho, dispostas sobre o feltro verde.</p>
  </div>

  <main id="playing-cards">

    <div class="card black">
      <div class="left">
        <span class="rank">A</span>
        <span class="corner-suit">&spades;</span>
      </div>
      <div class="middle">
        <span class="suit-big">&spades;</span>
        <span class="card-name">Ás de Espadas</span>
      </div>
      <div class="right">
        <span class="rank">A</span>
        <span class="corner-suit">&spades;</span>
      </div>
    </div>

    <div class="card red">
      <div class="left">
        <span class="rank">K</span>
        <span class="corner-suit">&hearts;</span>
      </div>
      <div class="middle">
        <span class="suit-big">&hearts;</span>
        <span class="card-name">Rei de Copas</span>
      </div>
      <div class="right">
        <span class="rank">K</span>
        <span class="corner-suit">&hearts;</span>
      </div>
    </div>

    <div class="card red">
      <div class="left">
        <span class="rank">Q</span>
        <span class="corner-suit">&diams;</span>
      </div>
      <div class="middle">
        <span class="suit-big">&diams;</span>
        <span class="card-name">Dama de Ouros</span>
      </div>
      <div class="right">
        <span class="rank">Q</span>
        <span class="corner-suit">&diams;</span>
      </div>
    </div>

    <div class="card black">
      <div class="left">
        <span class="rank">J</span>
        <span class="corner-suit">&clubs;</span>
      </div>
      <div class="middle">
        <span class="suit-big">&clubs;</span>
        <span class="card-name">Valete de Paus</span>
      </div>
      <div class="right">
        <span class="rank">J</span>
        <span class="corner-suit">&clubs;</span>
      </div>
    </div>

  </main>

  <p class="table-foot">Baralho de 52 cartas &middot; quatro naipes, um só destino</p>

</body>
</html>
